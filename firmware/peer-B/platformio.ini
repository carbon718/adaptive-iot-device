; Peer B - LoRa receiver (NUCLEO-L476RG + Wio-SX1262)
; https://docs.platformio.org/page/projectconf.html

[env:nucleo_l476rg]
platform = ststm32
board = nucleo_l476rg
framework = arduino
monitor_speed = 115200
upload_protocol = stlink

monitor_filters = time

; Common configuration (LoRa parameters, frame format, pins) shared with Peer A
build_flags =
    -I $PROJECT_DIR/../stm32/include

lib_deps =
    jgromes/RadioLib@^7.8.1
