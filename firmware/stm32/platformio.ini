; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nucleo_l476rg]
platform = ststm32
board = nucleo_l476rg
framework = arduino
monitor_speed = 115200
upload_protocol = stlink

; Keep _write (defined in core Print.cpp) linked when DEBUG_SERIAL = 0
build_flags = -Wl,-u,_write

monitor_filters = time

upload_port = /dev/cu.usbmodem3103
monitor_port = /dev/cu.usbmodem3103
upload_flags =
    -c
    adapter serial 066DFF555278665067084409

lib_deps =
    jgromes/RadioLib@^7.8.1
    stm32duino/STM32duino Low Power
    stm32duino/STM32duino RTC
